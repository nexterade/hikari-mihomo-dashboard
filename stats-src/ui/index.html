<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Hikari NetStat</title>
<style>
:root{
  --void:#0a0a12; --panel:#11111d; --panel2:#171726; --line:#26263f; --grid:#1c1c30;
  --ink:#ecebff; --ink2:#a3a3c4; --mute:#6c6c8c;
  --wifi:#00a2c3; --data:#ee3a93; --internal:#8f7dff;      /* warna data: lolos validator (dark, CVD dE 8.7) */
  --neon-c:#00f0ff; --neon-m:#ff2a85; --neon-y:#fcee0a;     /* aksen UI saja, bukan warna data */
  --ui:"Chakra Petch","Bahnschrift","Roboto Condensed","sans-serif-condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"Share Tech Mono",ui-monospace,"JetBrains Mono","Roboto Mono","DejaVu Sans Mono",monospace;
  --cut:14px;
}
*{box-sizing:border-box;margin:0}
html{background:var(--void);-webkit-text-size-adjust:100%}
body{
  min-height:100vh;color:var(--ink);font:500 15px/1.45 var(--ui);
  padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  background:
    linear-gradient(var(--void),var(--void)) padding-box,
    var(--void);
  background-image:
    linear-gradient(rgba(0,240,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.035) 1px,transparent 1px);
  background-size:32px 32px;
  position:relative;
}
body::after{ /* scanline tipis */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.28;
}
.wrap{max-width:760px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.wrap>*{min-width:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--neon-y);outline-offset:2px}

/* panel potong sudut */
.panel{
  position:relative;background:var(--panel);padding:16px;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));
}
.panel::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--neon-c),var(--neon-m) 60%,transparent)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 20px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 0 14px rgba(0,240,255,.55)}
.brand i{font-style:normal;color:var(--neon-m);text-shadow:0 0 14px rgba(255,42,133,.6)}
.chip{display:inline-flex;align-items:center;gap:8px;font:400 13px/1 var(--mono);color:var(--ink2);padding:7px 10px;background:var(--panel);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.chip b{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.chip[data-s=live] b{background:#3dff9a;box-shadow:0 0 8px #3dff9a}
.chip[data-s=stale] b{background:var(--neon-y)}
.chip[data-s=down] b{background:var(--neon-m);box-shadow:0 0 8px var(--neon-m)}

/* tab granularitas */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{padding:11px 8px;font:700 15px/1 var(--ui);letter-spacing:.06em;color:var(--ink2);background:var(--panel);
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);text-align:center;min-height:44px}
.tab[aria-selected=true]{background:var(--neon-y);color:#15130a}

/* hero */
.hero{padding:18px 16px 16px}
.hero-label{display:flex;justify-content:space-between;gap:10px;align-items:baseline;color:var(--ink2);font-size:14px}
.hero-label b{color:var(--ink);font-weight:700;font-size:16px}
.big{
  font:400 clamp(56px,17vw,92px)/1 var(--mono);letter-spacing:-.02em;margin:10px 0 4px;color:var(--ink);
  text-shadow:-2px 0 0 rgba(0,240,255,.75),2px 0 0 rgba(255,42,133,.75);   /* satu-satunya efek glitch di halaman */
  font-variant-numeric:tabular-nums;white-space:nowrap
}
.big small{font-size:.32em;letter-spacing:0;margin-left:.15em;text-shadow:none;color:var(--ink2)}
.delta{font:400 14px/1.3 var(--mono);color:var(--ink2)}
.delta.up{color:var(--neon-y)} .delta.dn{color:#3dff9a}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tile{background:var(--panel2);padding:12px 12px 12px 14px;position:relative;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.tile h3{font:700 14px/1 var(--ui);color:var(--ink2);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tile h3 i{width:10px;height:10px;background:var(--c);display:inline-block}
.tile .v{font:400 28px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.tile .s{font:400 13px/1.5 var(--mono);color:var(--ink2);margin-top:6px}
.share{height:6px;background:var(--line);margin-top:10px;display:flex;gap:2px}
.share span{display:block;height:100%}
.internal{margin-top:12px;font:400 13px/1.4 var(--mono);color:var(--mute)}
.internal i{display:inline-block;width:8px;height:8px;background:var(--internal);margin-right:6px}

/* chart */
.chart-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 14px;align-items:center;margin-bottom:10px}
.chart-head h2,.lists h2{font:700 16px/1.2 var(--ui);letter-spacing:.03em}
.legend{display:flex;gap:14px;color:var(--ink2);font-size:14px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.seg{display:flex;gap:6px}
.seg button{font:700 13px/1 var(--ui);padding:9px 12px;min-height:36px;color:var(--ink2);background:var(--panel2)}
.seg button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--neon-c)}
.plot{position:relative;touch-action:pan-y}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.plot .col{cursor:pointer}
.tt{position:absolute;z-index:5;pointer-events:none;min-width:168px;background:#05050b;border:1px solid var(--line);padding:9px 11px;
  font:400 13px/1.55 var(--mono);color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,.6)}
.tt b{display:block;font:700 14px/1.3 var(--ui);margin-bottom:3px}
.tt i{display:inline-block;width:8px;height:8px;margin-right:6px}
.tt[hidden]{display:none}

/* tabel */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font:400 14px/1.3 var(--mono);font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:var(--ui);font-weight:500}
th{font:700 13px/1.2 var(--ui);color:var(--ink2)}
tr[aria-current=true] td{color:var(--neon-y)}

/* daftar teratas */
.lists{display:grid;gap:18px}
.list h2{margin-bottom:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:7px 0;border-bottom:1px solid var(--line)}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.row .t{font:400 14px/1.3 var(--mono);color:var(--ink2);text-align:right}
.row .bar{grid-column:1/-1;height:4px;display:flex;gap:2px;background:var(--grid)}
.row .bar span{display:block;height:100%}
.empty{color:var(--ink2);padding:18px 4px;line-height:1.6}
.empty code{font-family:var(--mono);color:var(--neon-c)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;color:var(--mute);font:400 12px/1.5 var(--mono)}
.foot a{color:var(--neon-c);text-decoration:none;border-bottom:1px solid currentColor}
.err{background:#1a0a14;color:#ffd5e6;padding:14px 16px;border-left:4px solid var(--neon-m);line-height:1.6}
.err code{font-family:var(--mono);color:var(--neon-y)}

@media(min-width:700px){
  body{padding-top:28px}
  .lists{grid-template-columns:repeat(3,1fr)}
  .panel{padding:20px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand">Hikari<i>/</i>NetStat</div>
    <div class="chip" id="chip" data-s="down" role="status"><b></b><span id="chipTxt">menghubungkan…</span></div>
  </header>

  <div id="err" class="err" hidden></div>

  <nav class="tabs" role="tablist" aria-label="Rentang waktu">
    <button class="tab" role="tab" data-g="daily" aria-selected="true">Harian</button>
    <button class="tab" role="tab" data-g="weekly" aria-selected="false">Mingguan</button>
    <button class="tab" role="tab" data-g="monthly" aria-selected="false">Bulanan</button>
  </nav>

  <section class="panel hero" aria-live="polite">
    <div class="hero-label"><b id="hTitle">–</b><span id="hRange"></span></div>
    <div class="big" id="hTotal">0<small>B</small></div>
    <div class="delta" id="hDelta"></div>
    <div class="tiles">
      <div class="tile" style="--c:var(--wifi)">
        <h3><i></i>WiFi</h3><div class="v" id="wTot">0 B</div>
        <div class="s" id="wSub"></div>
      </div>
      <div class="tile" style="--c:var(--data)">
        <h3><i></i>Data seluler</h3><div class="v" id="dTot">0 B</div>
        <div class="s" id="dSub"></div>
      </div>
    </div>
    <div class="share" id="share" aria-hidden="true"></div>
    <div class="internal" id="internal"></div>
  </section>

  <section class="panel">
    <div class="chart-head">
      <h2 id="cTitle">Pemakaian per hari</h2>
      <div class="legend"><span><i style="background:var(--wifi)"></i>WiFi</span><span><i style="background:var(--data)"></i>Data seluler</span></div>
      <div class="seg" role="group" aria-label="Tampilan">
        <button id="vChart" aria-pressed="true">Grafik</button><button id="vTable" aria-pressed="false">Tabel</button>
      </div>
    </div>
    <div id="chartBox" class="plot"></div>
    <div id="tableBox" class="tbl" hidden></div>
  </section>

  <section class="panel lists" id="lists"></section>

  <footer class="foot">
    <span id="fLeft"></span>
    <span><a href="/api/export.csv" download>Ekspor CSV</a></span>
  </footer>
</main>

<script>
"use strict";
const $=s=>document.querySelector(s);
const U=["B","KB","MB","GB","TB"];
const nf=(v,d)=>v.toLocaleString("id-ID",{minimumFractionDigits:d,maximumFractionDigits:d});
function split(b){let i=0;while(b>=1000&&i<U.length-1){b/=1000;i++}return [b,U[i]]}
function fmt(b){const[v,u]=split(b);return nf(v,v>=100||u==="B"?0:v>=10?1:2)+" "+u}
function fmtBig(b){const[v,u]=split(b);return nf(v,u==="B"?0:v>=100?0:v>=10?1:2)+"<small>"+u+"</small>"}
const compact=b=>{const[v,u]=split(b);return (v>=10||u==="B"?Math.round(v):Math.round(v*10)/10).toString().replace(".",",")+u}
const tot=c=>c?c.up+c.down:0;
const NET=n=>n||{up:0,down:0,conns:0};

let S=null,gran="daily",sel=null,view="chart";
const GN={daily:{now:"Hari ini",prev:"kemarin",title:"Pemakaian per hari"},
          weekly:{now:"Minggu ini",prev:"minggu lalu",title:"Pemakaian per minggu"},
          monthly:{now:"Bulan ini",prev:"bulan lalu",title:"Pemakaian per bulan"}};

async function load(){
  try{
    const r=await fetch("/api/summary",{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    S=await r.json(); $("#err").hidden=true; render();
  }catch(e){
    S=null;
    const el=$("#err");el.hidden=false;
    el.innerHTML="Halaman nggak bisa nyambung ke collector. Cek: <code>sh stats-ctl.sh status</code>, lalu <code>sh stats-ctl.sh start</code>.";
    setChip("down","collector mati");
  }
}
function setChip(s,t){const c=$("#chip");c.dataset.s=s;$("#chipTxt").textContent=t}

function render(){
  const st=S.status, age=S.generated-st.lastPoll;
  if(st.ok&&age<20) setChip("live","live · "+new Date(S.generated*1000).toLocaleTimeString("id-ID",{hour12:false,timeZone:S.tz}));
  else if(st.ok) setChip("stale","tertunda "+age+" dtk");
  else{setChip("down","Mihomo putus");const el=$("#err");el.hidden=false;
    el.innerHTML="Collector hidup tapi gagal baca Mihomo: <code>"+esc(st.lastErr||"belum ada respons")+"</code>. Pastikan Box jalan dan secret di <code>hikari.yaml</code> sama dengan yang dipakai collector."}
  const series=S[gran], idx=Math.max(0,series.findIndex(e=>e.key===sel));
  const i=sel&&series.some(e=>e.key===sel)?idx:series.length-1;
  const e=series[i], p=i>0?series[i-1]:null;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.g===gran));
  const w=NET(e.nets.wifi), d=NET(e.nets.data), n=NET(e.nets.internal), T=tot(w)+tot(d);

  $("#hTitle").textContent=e.active?GN[gran].now:e.label;
  $("#hRange").textContent=gran==="daily"?e.label:(e.start+" → "+e.end);
  $("#hTotal").innerHTML=fmtBig(T);
  let dl="";
  if(p){const pt=tot(NET(p.nets.wifi))+tot(NET(p.nets.data));
    if(pt>0){const pc=(T-pt)/pt*100;dl=(pc>=0?"▲ ":"▼ ")+nf(Math.abs(pc),0)+"% dibanding "+(e.active?GN[gran].prev:"periode sebelumnya")+" ("+fmt(pt)+")"+(e.active?" · periode ini belum penuh":"");
      $("#hDelta").className="delta "+(pc>5?"up":pc<-5?"dn":"")}
    else{dl="Belum ada pembanding";$("#hDelta").className="delta"}}
  $("#hDelta").textContent=dl;
  $("#wTot").textContent=fmt(tot(w));$("#dTot").textContent=fmt(tot(d));
  $("#wSub").innerHTML="↓ "+fmt(w.down)+"<br>↑ "+fmt(w.up)+"<br>"+nf(w.conns,0)+" koneksi terlihat";
  $("#dSub").innerHTML="↓ "+fmt(d.down)+"<br>↑ "+fmt(d.up)+"<br>"+nf(d.conns,0)+" koneksi terlihat";
  const sh=$("#share");
  if(T>0){sh.hidden=false;sh.innerHTML='<span style="width:'+(tot(w)/T*100)+'%;background:var(--wifi)"></span><span style="width:'+(tot(d)/T*100)+'%;background:var(--data)"></span>'}else sh.hidden=true;
  $("#internal").innerHTML=tot(n)>0?'<i></i>Internal &amp; lokal (DNS, port proxy): '+fmt(tot(n))+' — tidak masuk total':"";

  $("#cTitle").textContent=GN[gran].title;
  drawChart(series,i);drawTable(series,i);drawLists(e);
  $("#fLeft").textContent="Dihitung sejak "+new Date(S.started*1000).toLocaleDateString("id-ID",{timeZone:S.tz,day:"numeric",month:"short",year:"numeric"})+" · WiFi = sumber "+(S.wifiCidrs||[]).join(", ")+" · "+S.tz+" · Total dari counter Mihomo; daftar teratas = perkiraan dari koneksi yang sempat terlihat";
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- grafik ---------- */
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),m=v/e;return (m<=1?1:m<=2?2:m<=5?5:10)*e}
function drawChart(series,iSel){
  const box=$("#chartBox"), W=Math.max(280,box.clientWidth||340), H=210, L=38, R=4, T=8, B=22;
  const pw=W-L-R, ph=H-T-B, n=series.length, slot=pw/n, bw=Math.min(24,slot*.68);
  const vals=series.map(e=>[tot(NET(e.nets.wifi)),tot(NET(e.nets.data))]);
  const max=niceMax(Math.max(...vals.map(v=>v[0]+v[1]),1)), y=v=>T+ph-v/max*ph;
  let g="";
  for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--grid)" stroke-width="1"/>'+
       '<text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end" fill="var(--mute)" font-size="11" font-family="var(--mono)">'+(k?compact(v):"0")+'</text>'}
  let bars="",xl="";
  series.forEach((e,i)=>{
    const cx=L+slot*i+slot/2, x=cx-bw/2, [a,b]=vals[i], op=i===iSel?1:.74;
    const hA=a/max*ph, hB=b/max*ph, gap=(hA>2&&hB>2)?2:0;
    if(hA>0.5) bars+=pathBar(x,y(a),bw,Math.max(hA-(hB>0?gap:0),1),b<=0,"var(--wifi)",op);
    if(hB>0.5) bars+=pathBar(x,y(a+b),bw,Math.max(hB,1),true,"var(--data)",op);
    const lbl=labelFor(e,i,n); if(lbl) xl+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" fill="'+(i===iSel?"var(--neon-y)":"var(--mute)")+'" font-size="11" font-family="var(--mono)">'+lbl+'</text>';
    bars+='<rect class="col" data-i="'+i+'" x="'+(cx-slot/2)+'" y="'+T+'" width="'+slot+'" height="'+(ph+B)+'" fill="transparent"/>';
  });
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" tabindex="0" aria-label="Grafik batang bertumpuk pemakaian WiFi dan data seluler. Gunakan panah kiri/kanan untuk memilih periode, atau buka tampilan Tabel.">'+g+bars+xl+'</svg><div class="tt" hidden></div>';
  const svg=box.querySelector("svg"), tt=box.querySelector(".tt");
  const show=i=>{const e=series[i],w=NET(e.nets.wifi),d=NET(e.nets.data);
    tt.innerHTML="<b>"+esc(e.label)+"</b><i style=\"background:var(--wifi)\"></i>WiFi "+fmt(tot(w))+"<br><i style=\"background:var(--data)\"></i>Data "+fmt(tot(d))+"<br>Total "+fmt(tot(w)+tot(d));
    tt.hidden=false;const cx=(L+slot*i+slot/2)/W*box.clientWidth, tw=tt.offsetWidth;
    tt.style.left=Math.max(0,Math.min(box.clientWidth-tw,cx-tw/2))+"px";tt.style.top="0px"};
  svg.addEventListener("pointermove",ev=>{const c=ev.target.closest(".col");if(c)show(+c.dataset.i)});
  svg.addEventListener("pointerleave",()=>tt.hidden=true);
  svg.addEventListener("click",ev=>{const c=ev.target.closest(".col");if(c){sel=series[+c.dataset.i].key;render()}});
  svg.addEventListener("keydown",ev=>{const k=ev.key;if(k!=="ArrowLeft"&&k!=="ArrowRight")return;ev.preventDefault();
    const ni=Math.max(0,Math.min(n-1,iSel+(k==="ArrowLeft"?-1:1)));sel=series[ni].key;render();$("#chartBox svg").focus()});
}
function pathBar(x,yTop,w,h,roundTop,fill,op){
  const r=roundTop?Math.min(4,w/2,h):0, yb=yTop+h;
  const d="M"+x+","+yb+"V"+(yTop+r)+(r?"Q"+x+","+yTop+" "+(x+r)+","+yTop+"H"+(x+w-r)+"Q"+(x+w)+","+yTop+" "+(x+w)+","+(yTop+r):"V"+yTop+"H"+(x+w))+"V"+yb+"Z";
  return '<path d="'+d+'" fill="'+fill+'" opacity="'+op+'"/>'}
function labelFor(e,i,n){
  if(gran==="daily"){return (n-1-i)%5===0?+e.key.slice(8):""}
  if(gran==="weekly"){return i%2===(n-1)%2?(+e.start.slice(8))+"/"+(+e.start.slice(5,7)):""}
  return e.label.slice(0,3)}

/* ---------- tabel ---------- */
function drawTable(series,iSel){
  const rows=series.map((e,i)=>({e,i})).reverse().map(({e,i})=>{
    const w=NET(e.nets.wifi),d=NET(e.nets.data);
    return '<tr'+(i===iSel?' aria-current="true"':'')+'><td>'+esc(e.label)+'</td><td>'+fmt(tot(w))+'</td><td>'+fmt(tot(d))+'</td><td>'+fmt(tot(w)+tot(d))+'</td><td>'+nf(w.conns+d.conns,0)+'</td></tr>'}).join("");
  $("#tableBox").innerHTML='<table><caption style="position:absolute;left:-9999px">Pemakaian per periode</caption><thead><tr><th>Periode</th><th>WiFi</th><th>Data</th><th>Total</th><th>Koneksi terlihat</th></tr></thead><tbody>'+rows+'</tbody></table>'}

/* ---------- daftar teratas ---------- */
function drawLists(e){
  const defs=[["proc","Aplikasi"],["group","Rute teratas"],["exit","Jalur keluar"]];
  const any=Object.values(e.top||{}).some(l=>l&&l.length);
  if(!any){$("#lists").innerHTML='<div class="empty">Belum ada data untuk periode ini. Collector mulai menghitung sejak koneksi pertama yang dia lihat. Buka beberapa app, tunggu beberapa detik, lalu muat ulang halaman.</div>';return}
  $("#lists").innerHTML=defs.map(([k,t])=>{
    const l=(e.top[k]||[]),mx=Math.max(1,...l.map(x=>x.wifi+x.data));
    return '<div class="list"><h2>'+t+'</h2>'+(l.length?l.map(x=>'<div class="row"><span class="n" title="'+esc(x.name)+'">'+esc(x.name)+'</span><span class="t">'+fmt(x.wifi+x.data)+'</span><div class="bar" aria-hidden="true"><span style="width:'+(x.wifi/mx*100)+'%;background:var(--wifi)"></span><span style="width:'+(x.data/mx*100)+'%;background:var(--data)"></span></div></div>').join(""):'<div class="empty">–</div>')+'</div>'}).join("")}

/* ---------- interaksi ---------- */
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{gran=t.dataset.g;sel=null;if(S)render()}));
$("#vChart").onclick=()=>setView("chart");$("#vTable").onclick=()=>setView("table");
function setView(v){view=v;$("#chartBox").hidden=v!=="chart";$("#tableBox").hidden=v!=="table";
  $("#vChart").setAttribute("aria-pressed",v==="chart");$("#vTable").setAttribute("aria-pressed",v==="table");if(S)render()}
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>S&&render(),120)});

/* boot: angka total naik sekali saat pertama muncul */
let booted=false;
const _render=render;
render=function(){
  if(!booted&&!matchMedia("(prefers-reduced-motion:reduce)").matches&&S){
    booted=true;const el=$("#hTotal");_render();const T=el.textContent;const t0=performance.now();
    const target=(()=>{const s=S[gran],e=s[s.length-1];return tot(NET(e.nets.wifi))+tot(NET(e.nets.data))})();
    (function step(t){const k=Math.min(1,(t-t0)/650),e=1-Math.pow(1-k,3);el.innerHTML=fmtBig(target*e);if(k<1)requestAnimationFrame(step);else el.innerHTML=fmtBig(target)})(t0);
  }else{booted=true;_render()}
};
load();setInterval(()=>{if(!document.hidden)load()},10000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
